{% extends 'layout.html' %}

{% block content %}
<style>
    .wc-container { padding: 10px; text-align: center; }
    .wc-title { color: #fff; margin-bottom: 5px; }
    .wc-subtitle { color: #aaa; font-size: 13px; margin-bottom: 20px; }
    
    .btn-draw { background: #ffb703; color: #000; font-weight: bold; padding: 12px 24px; border-radius: 25px; border: none; cursor: pointer; font-size: 15px; box-shadow: 0 4px 10px rgba(255,183,3,0.3); transition: transform 0.2s; }
    .btn-draw:hover { transform: scale(1.05); background: #ffa700; }

    .log-box { background: #111; border: 1px solid #333; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; color: #00ffcc; text-align: left; max-height: 120px; overflow-y: auto; margin: 15px auto; width: 90%; max-width: 800px; }

    .group-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; margin-top: 20px; text-align: left; }
    .group-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px; }
    .group-header { color: #ff4500; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 6px; margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
    
    .team-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #2a2a2a; font-size: 13px; }
    .team-name { color: #eee; font-weight: 500; }
    .confed-badge { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: bold; background: #333; color: #ffb703; }
</style>

<div class="wc-container">
    <h1 class="wc-title">🌍 FIFA World Cup 32 Qualifiers & Group Stage</h1>
    <p class="wc-subtitle">ระบบคัดเลือกตามโควตาทวีปจริง (AFC 6, CAF 4, CONMEBOL 5, CONCACAF 3, UEFA 13, OFC 1) รวม 32 ทีม</p>

    <button class="btn-draw" onclick="startQualifiersAndDraw()">🟡 จำลองรอบคัดเลือกและจับฉลากกลุ่ม (Group A - H)</button>

    <div class="log-box" id="drawLog">
        > กดปุ่มด้านบนเพื่อเริ่มการสิมูเลตรอบคัดเลือกและจับฉลากแบ่งกลุ่ม...
    </div>

    <div class="group-grid" id="groupGrid">
        <!-- Groups A-H will be populated here -->
    </div>
</div>

<script>
    const groups = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];

    // โควตาจำนวนทีมที่ผ่านเข้ารอบสุดท้ายตามทวีปจริง
    const slots = { 'AFC': 6, 'CAF': 4, 'CONMEBOL': 5, 'CONCACAF': 3, 'UEFA': 13, 'OFC': 1 };

    window.onload = function() {
        renderEmptyGroups();
    };

    function renderEmptyGroups() {
        const grid = document.getElementById('groupGrid');
        grid.innerHTML = '';
        groups.forEach(g => {
            grid.innerHTML += `
                <div class="group-card">
                    <h4 class="group-header">📌 Group ${g}</h4>
                    <div id="group-list-${g}">
                        <div style="color:#666; font-size:12px; text-align:center; padding:15px;">รอจับฉลาก...</div>
                    </div>
                </div>
            `;
        });
    }

    function addLog(msg) {
        const log = document.getElementById('drawLog');
        log.innerHTML += `> ${msg}<br>`;
        log.scrollTop = log.scrollHeight;
    }

    function startQualifiersAndDraw() {
        document.getElementById('drawLog').innerHTML = '';
        renderEmptyGroups();
        
        addLog("🌏 เริ่มการจำลองฟุตบอลโลกรอบคัดเลือกแยกตามทวีป...");

        // ดึงรายชื่อทีมจาก API (ใช้ทีมที่มีอยู่ในระบบ)
        fetch('/api/teams')
            .then(res => res.json())
            .then(teams => {
                // กรองเอาเฉพาะทีมชาติ
                let nationalTeams = teams.filter(t => t.type === 'National' || t.league.includes('World Cup'));
                
                if (nationalTeams.length === 0) {
                    // Fallback ถ้า API ส่งทีมมาไม่ครบ ให้ใช้ทีมมาตรฐาน
                    nationalTeams = getFallbackTeams();
                }

                simulateQualifiers(nationalTeams);
            })
            .catch(() => {
                // กรณี Offline หรือไม่มี API ให้ใช้ข้อมูลทีมชาติในระบบ
                simulateQualifiers(getFallbackTeams());
            });
    }

    function simulateQualifiers(allTeams) {
        // 1. แยกทีมตามทวีป
        let confedMap = { 'AFC': [], 'CAF': [], 'CONMEBOL': [], 'CONCACAF': [], 'UEFA': [], 'OFC': [] };
        
        allTeams.forEach(t => {
            let c = t.confederation || 'UEFA';
            if (confedMap[c]) confedMap[c].push(t);
            else confedMap['UEFA'].push(t);
        });

        let qualified32 = [];

        // 2. คัดเลือกทีมผ่านเข้ารอบตามโควตา
        Object.keys(slots).forEach(c => {
            let list = confedMap[c] || [];
            // สุ่มแต้มฟอร์มการเล่น + Rating เดิมเพื่อหาผู้ชนะ
            list.sort((a, b) => (b.rating + Math.random()*10) - (a.rating + Math.random()*10));
            
            let passed = list.slice(0, slots[c]);
            qualified32.push(...passed);

            addLog(`โซน ${c}: ผ่านเข้ารอบ ${passed.length}/${slots[c]} ทีม (${passed.map(p => p.name).join(', ')})`);
        });

        addLog(`✅ ได้ครบ 32 ทีมสุดท้าย! กำลังสุ่มจับฉลากลงกลุ่ม A - H...`);

        // 3. สุ่มจับฉลากลง Group A - H
        setTimeout(() => {
            shuffleArray(qualified32);
            
            groups.forEach(g => {
                document.getElementById(`group-list-${g}`).innerHTML = '';
            });

            qualified32.forEach((team, index) => {
                let groupIdx = index % 8;
                let groupName = groups[groupIdx];
                let container = document.getElementById(`group-list-${groupName}`);

                container.innerHTML += `
                    <div class="team-row">
                        <span class="team-name">${container.children.length + 1}. ${team.name}</span>
                        <span class="confed-badge">${team.confederation || 'UEFA'}</span>
                    </div>
                `;
            });

            addLog("🎉 การจับฉลากเสร็จสิ้นสมบูรณ์!");
        }, 600);
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function getFallbackTeams() {
        return [
            {name: 'Argentina', confederation: 'CONMEBOL', rating: 92}, {name: 'Brazil', confederation: 'CONMEBOL', rating: 90},
            {name: 'Colombia', confederation: 'CONMEBOL', rating: 86}, {name: 'Uruguay', confederation: 'CONMEBOL', rating: 85},
            {name: 'Ecuador', confederation: 'CONMEBOL', rating: 80}, {name: 'France', confederation: 'UEFA', rating: 91},
            {name: 'Spain', confederation: 'UEFA', rating: 90}, {name: 'England', confederation: 'UEFA', rating: 89},
            {name: 'Portugal', confederation: 'UEFA', rating: 88}, {name: 'Germany', confederation: 'UEFA', rating: 88},
            {name: 'Netherlands', confederation: 'UEFA', rating: 87}, {name: 'Italy', confederation: 'UEFA', rating: 86},
            {name: 'Belgium', confederation: 'UEFA', rating: 86}, {name: 'Croatia', confederation: 'UEFA', rating: 84},
            {name: 'Switzerland', confederation: 'UEFA', rating: 82}, {name: 'Denmark', confederation: 'UEFA', rating: 81},
            {name: 'Austria', confederation: 'UEFA', rating: 80}, {name: 'Poland', confederation: 'UEFA', rating: 78},
            {name: 'Japan', confederation: 'AFC', rating: 85}, {name: 'South Korea', confederation: 'AFC', rating: 83},
            {name: 'Iran', confederation: 'AFC', rating: 81}, {name: 'Australia', confederation: 'AFC', rating: 80},
            {name: 'Saudi Arabia', confederation: 'AFC', rating: 78}, {name: 'Thailand', confederation: 'AFC', rating: 73},
            {name: 'Morocco', confederation: 'CAF', rating: 84}, {name: 'Senegal', confederation: 'CAF', rating: 83},
            {name: 'Ivory Coast', confederation: 'CAF', rating: 82}, {name: 'Egypt', confederation: 'CAF', rating: 80},
            {name: 'Mexico', confederation: 'CONCACAF', rating: 82}, {name: 'USA', confederation: 'CONCACAF', rating: 81},
            {name: 'Canada', confederation: 'CONCACAF', rating: 78}, {name: 'New Zealand', confederation: 'OFC', rating: 72}
        ];
    }
</script>
{% endblock %}
